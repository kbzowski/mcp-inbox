# Overlay: adds local embeddings (Ollama) for semantic search.
#   docker compose -f compose.yaml -f compose.embeddings.yaml up -d
# Model: OLLAMA_EMBED_MODEL + OLLAMA_EMBED_DIMS (in .env or shell); defaults below.
services:
  mcp-inbox:
    environment:
      IMAP_EMBEDDINGS_BASE_URL: http://ollama:11434/v1
      IMAP_EMBEDDINGS_MODEL: ${OLLAMA_EMBED_MODEL:-snowflake-arctic-embed2}
      IMAP_EMBEDDINGS_DIMS: ${OLLAMA_EMBED_DIMS:-1024}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['ollama', 'pull', '${OLLAMA_EMBED_MODEL:-snowflake-arctic-embed2}']
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

volumes:
  ollama-models:
