# Overlay: adds local embeddings (Ollama) for semantic search.
#   docker compose -f compose.yaml -f compose.embeddings.yaml up -d
# Ollama has no published port; mail text stays on the compose network.
services:
  mcp-inbox:
    environment:
      IMAP_EMBEDDINGS_BASE_URL: http://ollama:11434/v1
      IMAP_EMBEDDINGS_MODEL: snowflake-arctic-embed2
      IMAP_EMBEDDINGS_DIMS: '1024'
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      retries: 20

  # One-shot: pulls the model into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['ollama', 'pull', 'snowflake-arctic-embed2']
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

volumes:
  ollama-models:
