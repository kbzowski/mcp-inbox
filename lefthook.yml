pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: '*.{ts,js,mjs,json}'
      run: npx oxfmt {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: '{src,tests}/**/*.ts'
      run: npx oxlint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck

    - name: typecheck-thunderbird
      run: npm run typecheck --prefix thunderbird-plugin

    - name: lint
      run: npm run lint

    - name: test
      run: npm run test
